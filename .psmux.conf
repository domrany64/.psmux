# Oh My Psmux: native Windows profile inspired by Oh My Tmux.

set -g default-terminal "xterm-256color"
set -g prefix2 C-a
bind C-a send-prefix -2
set -s escape-time 10
set -sg repeat-time 600
set -s focus-events on
set -g history-limit 5000

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
set -g set-titles on
set -g display-panes-time 800
set -g display-time 1000
set -g status-interval 10
set -g mouse on
set -g monitor-activity on
set -g visual-activity off
set -g mode-keys vi

bind e run-shell 'notepad.exe "$HOME/.psmux.conf"'
bind r source-file ~/.psmux.conf \; display-message "Configuration reloaded"

bind 0 select-window -t :=10
bind -r C-h previous-window
bind -r C-l next-window
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1
bind Tab last-window
unbind n
unbind p

bind -n C-l send-keys C-l \; clear-history
bind C-c new-session
bind C-f command-prompt -p "(find-session)" "switch-client -t %%"
bind BTab switch-client -l
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U
bind + resize-pane -Z
bind F display-popup -E -w 80% -h 80% -d "#{pane_current_path}" powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$HOME/.psmux/plugins/oh-my-psmux/path-picker.ps1" "#{pane_id}"
bind U display-popup -E -w 80% -h 80% -d "#{pane_current_path}" powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$HOME/.psmux/plugins/oh-my-psmux/url-picker.ps1" "#{pane_id}"
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind m set -gF mouse '#{?mouse,off,on}' \; display "mouse: #{?mouse,on,off}"

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer

source-file -q ~/.psmux.conf.local